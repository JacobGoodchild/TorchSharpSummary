name: Release & Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test --configuration Release

      - name: Pack Package
        run: dotnet pack src/TorchSharpSummary/TorchSharpSummary.csproj --configuration Release --output ./nupkg

      # Requires Trusted Publishing to be configured on nuget.org first: on the package's
      # "Trusted Publishing" settings, register this exact repo (JacobGoodchild/TorchSharpSummary)
      # and this workflow file path (.github/workflows/release.yml). Without that link, the OIDC
      # token exchange below is rejected. See https://www.nuget.org/policies/Trusted-Publishing.
      #
      # Pinned to a full commit SHA (v1.2.0), not the mutable "v1" tag: this action runs with
      # id-token: write, so a moving tag would let a future repoint of NuGet/login's "v1" ref —
      # intentional or not — change what code executes here without this file changing. Verified
      # against https://github.com/NuGet/login's own tags before pinning; bump deliberately.
      - name: Log in to NuGet via OIDC
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: JacobGoodchild

      - name: Push Package to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
